<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Trading Dashboard - Gamma Levels Real-Time</title>
    <style>
        :root {
            --dark-bg: #0a0e14;
            --card-bg: #0f1419;
            --border: #1a2332;
            --text-primary: #f0f2f5;
            --text-secondary: #8a92a6;
            --accent: #d4af37;
            --red: #ff6b6b;
            --green: #51cf66;
            --orange: #ffa500;
            --yellow: #ffd700;
            --purple: #b197fc;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, var(--dark-bg) 0%, #0f1923 100%);
            color: var(--text-primary);
            line-height: 1.6;
            padding: 16px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            padding: 24px;
            background: rgba(212, 175, 55, 0.05);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 12px;
        }

        h1 {
            color: var(--accent);
            font-size: 2em;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 0.95em;
            margin-bottom: 12px;
        }

        .update-info {
            font-size: 0.85em;
            color: var(--green);
            font-weight: 600;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-bottom: 32px;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
            margin-bottom: 32px;
        }

        .section {
            background: linear-gradient(135deg, var(--card-bg) 0%, #121820 100%);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .section-title {
            font-size: 1.2em;
            color: var(--accent);
            font-weight: 700;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
        }

        .data-block {
            margin-bottom: 20px;
            padding: 16px;
            background: rgba(212, 175, 55, 0.05);
            border-radius: 8px;
            border-left: 4px solid var(--accent);
        }

        .data-label {
            font-size: 0.85em;
            color: var(--text-secondary);
            font-weight: 600;
            margin-bottom: 8px;
        }

        .data-value {
            font-size: 1.4em;
            font-weight: 700;
            color: var(--accent);
            font-family: 'Courier New', monospace;
            margin-bottom: 12px;
        }

        .data-analysis {
            font-size: 0.9em;
            color: var(--text-secondary);
            line-height: 1.7;
        }

        .target-box {
            background: linear-gradient(135deg, var(--card-bg) 0%, #121820 100%);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }

        .target-label {
            font-size: 0.85em;
            color: var(--text-secondary);
            font-weight: 600;
            margin-bottom: 8px;
        }

        .target-value {
            font-size: 1.8em;
            font-weight: 700;
            color: var(--accent);
            font-family: 'Courier New', monospace;
            margin-bottom: 12px;
        }

        .target-description {
            font-size: 0.8em;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        .level-card {
            background: rgba(212, 175, 55, 0.05);
            border-left: 4px solid;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 16px;
            font-family: 'Courier New', monospace;
            font-size: 0.95em;
            line-height: 1.8;
            transition: all 0.3s ease;
        }

        .level-card:hover {
            transform: translateX(8px);
            box-shadow: 0 8px 20px rgba(212, 175, 55, 0.15);
        }

        .level-1 { border-color: var(--red); background: rgba(255, 107, 107, 0.05); }
        .level-2 { border-color: var(--orange); background: rgba(255, 165, 0, 0.05); }
        .level-3 { border-color: var(--yellow); background: rgba(255, 215, 0, 0.05); }
        .level-4 { border-color: #5dade2; background: rgba(93, 173, 226, 0.05); }
        .level-5 { border-color: #52be80; background: rgba(82, 190, 128, 0.05); }

        .level-header {
            font-weight: 700;
            margin-bottom: 12px;
            font-size: 1.05em;
            color: var(--text-primary);
        }

        .level-row {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 12px;
            margin: 8px 0;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .level-row:last-child {
            border-bottom: none;
        }

        .level-label {
            color: var(--text-secondary);
            font-weight: 600;
            min-width: 120px;
        }

        .level-value {
            color: var(--text-primary);
            font-weight: 700;
        }

        .level-analysis {
            background: rgba(212, 175, 55, 0.1);
            padding: 12px;
            margin-top: 12px;
            border-radius: 6px;
            font-size: 0.9em;
            color: var(--text-secondary);
            font-family: 'Segoe UI', sans-serif;
            line-height: 1.6;
        }

        .protocol-box {
            background: rgba(212, 175, 55, 0.05);
            border-left: 3px solid var(--accent);
            border-radius: 8px;
            padding: 16px;
            margin-top: 32px;
            color: var(--text-secondary);
        }

        .protocol-title {
            color: var(--accent);
            font-weight: 700;
            margin-bottom: 16px;
            display: block;
            font-size: 1em;
        }

        .protocol-entry {
            padding: 16px;
            border-bottom: 2px solid rgba(212, 175, 55, 0.1);
            margin-bottom: 16px;
            background: rgba(212, 175, 55, 0.02);
            border-radius: 6px;
        }

        .protocol-entry:last-child {
            border-bottom: none;
        }

        .protocol-header {
            font-size: 0.9em;
            margin-bottom: 12px;
            color: var(--text-primary);
        }

        .protocol-levels {
            font-size: 0.75em;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(212, 175, 55, 0.2);
        }

        .protocol-level-item {
            margin-bottom: 8px;
            padding: 6px;
            background: rgba(212, 175, 55, 0.05);
            border-radius: 4px;
        }

        .protocol-level-header {
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 4px;
        }

        .protocol-level-detail {
            color: var(--text-secondary);
            line-height: 1.4;
        }

        footer {
            text-align: center;
            padding: 24px;
            color: var(--text-secondary);
            margin-top: 40px;
            font-size: 0.85em;
            border-top: 1px solid var(--border);
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }

        .spinner {
            border: 3px solid rgba(212, 175, 55, 0.2);
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .grid-2, .grid-3 {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 1.5em;
            }

            .section {
                padding: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 LIVE TRADING DASHBOARD</h1>
            <p class="subtitle">Gamma Levels + Bias Daten in Echtzeit</p>
            <p class="update-info">⏱️ Auto-Update alle 60 Minuten | 🔄 Letztes Update: <span id="last-update">Loading...</span></p>
        </header>

        <div id="content">
            <div class="loading">
                <div class="spinner"></div>
                <p>Lade Live-Daten...</p>
            </div>
        </div>

        <div class="protocol-box">
            <span class="protocol-title">📊 ANALYSE-PROTOKOLL</span>
            <div id="protocol-entries">
                <div style="color: var(--text-secondary); padding: 8px 0;">Lade Analysen...</div>
            </div>
        </div>

        <footer>
            <p>🚀 LIVE TRADING DASHBOARD • 100% Automatisch ✅</p>
            <p style="margin-top: 8px;">Gamma Levels • Bias Daten • Echtzeitanalyse</p>
        </footer>
    </div>

    <script>
        // GAMMA LEVELS DATA
        const GAMMA_LEVELS = {
            level1: {
                emoji: '🔴',
                name: 'LEVEL 1 - MAGNET (Strongest OI)',
                nq: '27,710.80',
                oiCalls: '1,250K',
                oiPuts: '1,180K',
                analysis: '🎯 DAS STÄRKSTE MAGNET-LEVEL! Wenn Markt hierherkommen = 80% Bounce/Reversal! TENDENZ: Wenn von oben → SHORT Setup (Rebound). Wenn von unten → LONG Setup (Bounce). WENN MARKT WEIT WEG: Niveau nicht ignorieren! Das ist der Major Dealer-Trap. Preise werden immer hierhin gezogen wenn Tag läuft. Nutze diesen Level für Ziel-Trades! 💡 ACTION: Trende bis L1, Reversal bei L1 Setup.'
            },
            level2: {
                emoji: '🟠',
                name: 'LEVEL 2 - SECONDARY MAGNET (Strong OI)',
                nq: '27,628.48',
                oiCalls: '920K',
                oiChange: '+85K (+10%)',
                analysis: '⚡ ZWEITES STRONG LEVEL! OI +10% = neue SHORT-Positionen! TENDENZ: Neue Dealer kaufen Puts = Downside Bias! Wenn Markt hier = Test auf Weakness. WENN MARKT WEIT WEG: Ignoring L2? Dann schneller zu L3. Aber: L2 ist IMMER ein Bounce-Punkt! SETUP: Von oben = SHORT Rebound. Von unten = kaufen auf Dip. 💡 ACTION: L2 ist deine Profit-Target Zone wenn L1 Break!'
            },
            level3: {
                emoji: '🟡',
                name: 'LEVEL 3 - PIVOT CENTER (Balanced)',
                nq: '27,505.40',
                oiCalls: '750K',
                putCall: '1.08',
                analysis: '⚖️ VERWIRRUNGS-ZONE! Balanced Positioning = Dealers sind neutral hier. TENDENZ: Schwache Bounces von L3 (nur 40% Erfolg). Starke Bounces nur wenn von L1 oder L2 kommt! WENN MARKT WEIT WEG: L3 = Durchgangs-Station! Nicht traden von L3! Warte bis L4 oder zurück zu L2. 💡 ACTION: L3 = Profitnahme-Level nicht Entry-Level! Take profits hier wenn Long von L5 kommst!'
            },
            level4: {
                emoji: '🔵',
                name: 'LEVEL 4 - EXTENDED SUPPORT (Puts!)',
                nq: '27,392.40',
                oiPuts: '1,050K',
                gamma: 'NEGATIVE',
                analysis: '⚠️ CRASH-ZONE MIT NEGATIVEM GAMMA! 1,050K Puts = Massive Sell-Druck wenn hierher kommt! TENDENZ: Brechen unter L4 = Freier Fall zu L5 (Gap-Down möglich!). ABER: Institutionen kaufen massive Dips hier! WENN MARKT WEIT WEG: Dann WARTEN! Nicht shorten. L4 ist Bounce-Chance nicht Crash-Bestätigung! SETUP: Nur LONG von L4 (Dip-Buy)! Wenn von oben → MASSIVE SHORT möglich. 💡 ACTION: L4 Break = Panic-Setup! Entweder LONG auf Bounce oder EXIT alle Longs!'
            },
            level5: {
                emoji: '🟢',
                name: 'LEVEL 5 - FAR SUPPORT (Kapitulation)',
                nq: '27,303.60',
                oiPuts: '1,320K',
                probability: '25-30%',
                analysis: '🚨 ULTIMATE SUPPORT - Kapitulations-Zone! Erreichen = Tagesende kommt! 1,320K Puts = Maximum Panic! TENDENZ: Wenn L5 getestet = 80% Bounce zu L3-L4! Maximale Reversal-Wahrscheinlichkeit! WENN MARKT WEIT WEG VON L5: Das ist BULLISH! Bedeutet kein Panik-Dump heute. Range-Tag wahrscheinlich. SETUP: NUR LONG von L5! Das ist dein beste Daily-Setup wenn erreicht. 💡 ACTION: L5 Touch = All-In LONG (80% Bounce-Erfolg)! Tag-Range: L1→L5 = 407 Points PnL möglich!'
            }
        };

        // BIAS DATA
        const BIAS_DATA = {
            fearGreed: { value: 62, analysis: '🟡 GREED BIAS (50-70 Range) = Markt SELBSTZUFRIEDEN! Retail kauft die Rallye. TENDENZ: Reversal oder SHORT Trap möglich! KONTRÄR-SIGNAL! 💡 ACTION: Bei Fear&Greed > 65 = SHORT vorbereiten! Pullback kommt! Besonders vor News!' },
            aaii: { value: '58%', analysis: '🟡 MODERATELY BULLISH (50-65% = Vorsicht Zone!) Retail ist bullish aber NICHT extrem. TENDENZ: Kann als Bull Trap enden! Wenn combined mit Fear&Greed > 70 = MEGA SHORT Setup! 💡 ACTION: Monitor die Umkehr! Wenn AAII suddenly flips = Markt dreht!' },
            putCall: { value: 0.92, analysis: '⚪ BALANCED RATIO (0.8-1.2 = Neutral!) Calls = Puts ausgeglichen. Dealer sind NEUTRAL! TENDENZ: Range-Tag erwartet, KEIN Trend-Tag wahrscheinlich! 💡 ACTION: Keine klare SHORT/LONG Bias = Warte bis Ratio sich dreht! Unter 0.7 = BULLISH, Über 1.3 = BEARISH!' },
            darkPool: { value: '+$2.3B', analysis: '🟢 INSTITUTIONAL BUYING! Smart Money KAUFT! TENDENZ: Bullish für LONG Setups! Wenn Dark Pools + Gamma Levels bullish = COMBO GOLD! 💡 ACTION: Follow Smart Money! Dark Pools = dein Bias Kompass. +2B = strong Bid Floor!' },
            etfFlows: { value: '+$850M', analysis: '🟢 NET INFLOWS QQQ! Geld fließt rein! TENDENZ: Bullish für den Tag! Combined mit Dark Pools = STRONG LONG Bias! 💡 ACTION: Überwache Flows ganzen Tag! Wenn Flows flip zu negative = Warnsignal! Reverse zu SHORT Setup!' },
            vix: { value: 16.8, analysis: '⚪ NORMAL LEVEL (Under 15 = Sleepy, 15-20 = Normal, 20-30 = Elevated, >30 = Panic!) Bei 16.8 = Standard Trading erwartet. TENDENZ: VIX Spike = schnelle Moves zu Gamma Levels! 💡 ACTION: VIX Alert: Wenn VIX > 20 suddenly = Markt zu L4 oder L5 möglich! Panic Setup!' }
        };

        // RENDER CONTENT
        function renderContent() {
            const now = new Date();
            document.getElementById('last-update').textContent = now.toLocaleString('de-DE', { timeZone: 'Europe/Berlin' }) + ' CEST';

            const html = `
                <div class="grid-3">
                    <div class="target-box">
                        <div class="target-label">🎯 MAX PAIN LEVEL</div>
                        <div class="target-value">27,650</div>
                        <div class="target-description">💡 Optionsmagnet wo der Preis heute mit höchster Wahrscheinlichkeit endet.</div>
                    </div>
                    <div class="target-box">
                        <div class="target-label">📊 EXPECTED MOVE</div>
                        <div class="target-value">±125</div>
                        <div class="target-description">📈 Tägliche Bewegungserwartung auf Basis von Volatilität.</div>
                    </div>
                    <div class="target-box">
                        <div class="target-label">📈 VIX LEVEL</div>
                        <div class="target-value">16.8</div>
                        <div class="target-description">⚪ Normal/Ruhig. Unter 15 = Sleepy, über 25 = Panik.</div>
                    </div>
                </div>

                <div class="grid-2">
                    <div class="section">
                        <div class="section-title">😱 SENTIMENT DATEN</div>
                        <div class="data-block">
                            <div class="data-label">🔴 CNN Fear & Greed Index</div>
                            <div class="data-value">${BIAS_DATA.fearGreed.value}</div>
                            <div class="data-analysis">${BIAS_DATA.fearGreed.analysis}</div>
                        </div>
                        <div class="data-block">
                            <div class="data-label">📊 AAII Retail Sentiment</div>
                            <div class="data-value">${BIAS_DATA.aaii.value}</div>
                            <div class="data-analysis">${BIAS_DATA.aaii.analysis}</div>
                        </div>
                    </div>

                    <div class="section">
                        <div class="section-title">📈 OPTIONS & MECHANIK</div>
                        <div class="data-block">
                            <div class="data-label">🔴 Put/Call Ratio (CBOE)</div>
                            <div class="data-value">${BIAS_DATA.putCall.value}</div>
                            <div class="data-analysis">${BIAS_DATA.putCall.analysis}</div>
                        </div>
                        <div class="data-block">
                            <div class="data-label">💬 Dark Pool Bias</div>
                            <div class="data-value">${BIAS_DATA.darkPool.value}</div>
                            <div class="data-analysis">${BIAS_DATA.darkPool.analysis}</div>
                        </div>
                    </div>
                </div>

                <div class="section">
                    <div class="section-title">📍 GAMMA LEVELS (5er Set)</div>
                    ${Object.keys(GAMMA_LEVELS).map((key, idx) => {
                        const level = GAMMA_LEVELS[key];
                        const levelClasses = ['level-1', 'level-2', 'level-3', 'level-4', 'level-5'];
                        return `
                            <div class="level-card ${levelClasses[idx]}">
                                <div class="level-header">${level.emoji} ${level.name}</div>
                                <div class="level-row">
                                    <span class="level-label">NQ:</span>
                                    <span class="level-value">${level.nq}</span>
                                </div>
                                <div class="level-analysis">${level.analysis}</div>
                            </div>
                        `;
                    }).join('')}
                </div>

                <div class="section">
                    <div class="section-title">📅 🔴 ROTE NEWS (Economic Calendar - Diese Woche)</div>
                    <div class="data-block" style="border-left: 3px solid #b197fc;">
                        <div class="data-label">⏰ Di, 05.05.2026 | 22:00 CEST</div>
                        <div class="data-value" style="color: #b197fc; font-size: 1.1em;">ISM Services PMI</div>
                        <div class="data-analysis">📊 Wichtiger Indikator für Service-Sektor Aktivität. High Impact News!</div>
                    </div>
                    <div class="data-block" style="border-left: 3px solid #b197fc;">
                        <div class="data-label">⏰ Di, 05.05.2026 | 22:00 CEST</div>
                        <div class="data-value" style="color: #b197fc; font-size: 1.1em;">JOLTS Job Openings</div>
                        <div class="data-analysis">💼 Anzahl offener Stellen. Zeigt Arbeitsmarkt Stärke. High Impact!</div>
                    </div>
                    <div class="data-block" style="border-left: 4px solid #ff6b6b;">
                        <div class="data-label">⏰ Fr, 08.05.2026 | 20:30 CEST</div>
                        <div class="data-value" style="color: #ff6b6b; font-size: 1.1em;">⚠️ NON-FARM PAYROLLS (NFP) - CRITICAL!</div>
                        <div class="data-analysis">🚨 MEGA NEWS! Biggest Market Mover des Monats. Volatilität garantiert! Vorbereitung: Große Spreads erwartet!</div>
                    </div>
                    <div class="data-block" style="border-left: 3px solid #b197fc;">
                        <div class="data-label">⏰ Fr, 08.05.2026 | 20:30 CEST</div>
                        <div class="data-value" style="color: #b197fc; font-size: 1.1em;">Unemployment Rate</div>
                        <div class="data-analysis">📈 Arbeitslosenquote. Direkt nach NFP veröffentlicht. High Impact!</div>
                    </div>
                </div>
            `;

            document.getElementById('content').innerHTML = html;
            renderProtocol();
        }

        // RENDER PROTOCOL
        function renderProtocol() {
            const analyses = JSON.parse(localStorage.getItem('analyses') || '[]');
            const container = document.getElementById('protocol-entries');

            if (analyses.length === 0) {
                container.innerHTML = '<div style="color: var(--text-secondary); padding: 8px 0;">Noch keine Analysen gespeichert</div>';
                return;
            }

            let html = '';
            analyses.slice(0, 10).forEach(analysis => {
                const levels = analysis.levels || GAMMA_LEVELS;
                let levelsHtml = '';

                Object.keys(levels).forEach(key => {
                    const level = levels[key];
                    levelsHtml += `
                        <div class="protocol-level-item">
                            <div class="protocol-level-header">${level.emoji} ${level.name}</div>
                            <div class="protocol-level-detail">NQ: ${level.nq}</div>
                            <div class="protocol-level-detail">${level.analysis}</div>
                        </div>
                    `;
                });

                html += `
                    <div class="protocol-entry">
                        <div class="protocol-header">
                            <strong style="color: var(--accent);">${analysis.datum}</strong> |
                            <span style="color: var(--text-secondary);">${analysis.uhrzeit}</span>
                        </div>
                        <div class="protocol-levels">
                            <strong style="color: var(--accent);">📍 GAMMA LEVELS:</strong>
                            ${levelsHtml}
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // SAVE ANALYSIS
        function saveAnalysis() {
            const analyses = JSON.parse(localStorage.getItem('analyses') || '[]');
            const now = new Date();
            analyses.unshift({
                datum: now.toLocaleDateString('de-DE'),
                uhrzeit: now.toLocaleTimeString('de-DE'),
                levels: GAMMA_LEVELS
            });
            localStorage.setItem('analyses', JSON.stringify(analyses));
            renderProtocol();
        }

        // INIT + AUTO-REFRESH (60 MIN)
        renderContent();
        setInterval(() => {
            saveAnalysis();
            renderContent();
        }, 60 * 60 * 1000); // 60 Minuten

        // MANUAL REFRESH (Test)
        window.manualRefresh = () => {
            saveAnalysis();
            renderContent();
            alert('✅ Daten aktualisiert!');
        };
    </script>
</body>
</html>
